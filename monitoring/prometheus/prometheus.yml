global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    network: hoodi
    host: hoodi-1

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: reth
    static_configs:
      - targets: ["reth:9001"]

  - job_name: lighthouse-beacon
    static_configs:
      - targets: ["beacon:5054"]

  - job_name: lighthouse-validator
    static_configs:
      - targets: ["validator:5064"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
